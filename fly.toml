app = "kessler"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  KESSLER_DB_PATH = "/data/kessler.db"

[[mounts]]
  source = "kessler_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
