# fly.toml app configuration file generated for kessler on 2026-08-14T19:13:46+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kessler'
primary_region = 'lhr'

[build]
[env]
  KESSLER_DB_PATH = '/data/kessler.db'
  PORT = '8080'

[[mounts]]
  source = 'kessler_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
