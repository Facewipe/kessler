[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kessler"
version = "0.1.0"
description = "Satellite conjunction screening API built on open orbital data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sgp4>=2.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["kessler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a larger synthetic catalog (deselect with -m \"not slow\")",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
