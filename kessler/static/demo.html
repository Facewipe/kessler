<title>kessler — live demo</title>
<style>
  :root {
    --ocean: #0c1116;
    --land: #262f38;
    --coastline: #4d5b68;
    --graticule: rgba(255, 255, 255, 0.07);
    --accent: #ffcc66;
    --text: #c9d1d9;
    --muted-text: #8b949e;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background: #05070a;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 24px 16px 40px;
  }

  header {
    max-width: 960px;
    margin: 0 auto 16px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  #status {
    color: var(--muted-text);
    margin: 0;
  }

  #map-wrap {
    max-width: 960px;
    margin: 0 auto;
  }

  #map {
    width: 100%;
    height: auto;
    display: block;
    background: var(--ocean);
    border: 1px solid #1c2229;
    border-radius: 4px;
  }

  .ocean {
    fill: var(--ocean);
  }

  .land {
    fill: var(--land);
    stroke: var(--coastline);
    stroke-width: 0.4;
  }

  .graticule {
    stroke: var(--graticule);
    stroke-width: 0.3;
    fill: none;
  }

  .satellite-marker {
    fill: var(--accent);
    stroke: #1a1300;
    stroke-width: 0.3;
  }

  #missing {
    max-width: 960px;
    margin: 12px auto 0;
    padding: 10px 12px;
    border: 1px solid #4d3a1f;
    background: #1a140a;
    color: #e3b341;
    font-size: 0.85rem;
    border-radius: 4px;
  }

  #missing[hidden] {
    display: none;
  }

  footer {
    max-width: 960px;
    margin: 16px auto 0;
    color: var(--muted-text);
    font-size: 0.8rem;
  }
</style>
</head>

  </svg>
</div>

<div id="missing" hidden></div>

<footer>
  Geometric positions from public TLEs (SGP4). Not a collision probability —
  see <code>docs/accuracy.md</code>.
</footer>

<script>
  // Curated NORAD IDs for the demo. Not every ID is guaranteed to be in the
  // catalog (e.g. it may be stale/decayed/not yet ingested); IDs that come
  // back 404 are reported below instead of silently dropped.
  const CURATED_SATELLITES = [
    [25544, "ISS (ZARYA)"],
    [20580, "HST"],
    [25994, "TERRA"],
    [27424, "AQUA"],
    [28654, "NOAA 18"],
    [33591, "NOAA 19"],
    [43013, "NOAA 20"],
    [39084, "LANDSAT 8"],
    [49260, "LANDSAT 9"],
    [39634, "SENTINEL-1A"],
    [40697, "SENTINEL-2A"],
    [41335, "SENTINEL-3A"],
    [43205, "STARLINK-1007"],
    [44713, "STARLINK-1130"],
    [41019, "GPS BIIF-12"],
    [24876, "GPS BIIR-2"],
    [27386, "ENVISAT"],
    [29155, "GOES 13"],
    [22675, "COSMOS 2251 DEB"],
    [37849, "GOES 15"],
    [39533, "METOP-B"],
  ];

  const SVG_NS = "http://www.w3.org/2000/svg";

  async function fetchSatellite([noradId, label]) {
    try {
      const response = await fetch(`/satellites/${noradId}/position`);
      if (response.status === 404) {
        return { noradId, label, found: false };
      }
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const data = await response.json();
      return { noradId, label, found: true, data };
    } catch (err) {
      console.error(
        `kessler demo: failed to fetch position for NORAD ${noradId} (${label})`,
        err
      );
      return { noradId, label, found: false };
    }
  }

  function plotMarker(result) {
    const { data } = result;
    const marker = document.createElementNS(SVG_NS, "circle");
    marker.setAttribute("cx", data.lon.toFixed(2));
    marker.setAttribute("cy", (-data.lat).toFixed(2));
    marker.setAttribute("r", "1.4");
    marker.setAttribute("class", "satellite-marker");

    const title = document.createElementNS(SVG_NS, "title");
    const staleNote = data.stale ? " — stale TLE" : "";
    title.textContent = `${data.name} (NORAD ${result.noradId})${staleNote}`;
    marker.appendChild(title);

    document.getElementById("markers").appendChild(marker);
  }

  function renderMissing(missing) {
    if (missing.length === 0) {
      return;
    }
    const summary = missing.map((r) => `${r.label} (${r.noradId})`).join(", ");
    console.warn(
      `kessler demo: ${missing.length} curated satellite(s) not found in the catalog — ` +
        "the curated list may be stale:",
      summary
    );
    const missingEl = document.getElementById("missing");
    missingEl.hidden = false;
    missingEl.textContent = `Not found in catalog (curated list may be stale): ${summary}`;
  }

  async function init() {
    const results = await Promise.all(CURATED_SATELLITES.map(fetchSatellite));
    const found = results.filter((r) => r.found);
    const missing = results.filter((r) => !r.found);

    document.getElementById("status").textContent =
      `${found.length} / ${CURATED_SATELLITES.length} satellites plotted`;

    found.forEach(plotMarker);
    renderMissing(missing);
  }

  init();
</script>
</body>
</html>
